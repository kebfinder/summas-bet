name: public_web_smoke

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Init DB
        run: python init_db.py

      - name: Run public_web smoke
        run: |
          python scripts/smoke_public_web.py --date "$(date -u +%F)" --days 3 > public_web_smoke_report.json

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: public_web_smoke_report
          path: public_web_smoke_report.json
